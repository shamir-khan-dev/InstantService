version: '3.8'

services:
  backend:
    build: ./backend
    expose:
      - "8000"
    deploy:
      replicas: 3
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
    restart: always

  frontend:
    build: ./frontend
    expose:
      - "3000"
    env_file:
      - ./frontend/.env.local
    depends_on:
      - backend
    restart: always

  nginx:
    image: nginx:alpine
    container_name: instantservice_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    restart: always
